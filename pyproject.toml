[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "causalchain"
version = "0.1.0"
description = "Deterministic causal incident analysis agent."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "CausalChain" }]
dependencies = [
  "click>=8.1",
  "fastapi>=0.110",
  "httpx>=0.27",
  "pydantic>=2.0",
  "uvicorn>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
causalchain = "causalchain.cli:cli"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

